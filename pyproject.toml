[project]
name = "scoutmini"
version = "0.1.0"
description = "ScoutMini — an AI sports-analysis CLI that answers F1 questions from real, sourced data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# FastF1 deep-data adapter (Day 4 scope). Kept optional so the core v1 pipeline
# installs cleanly without pulling heavy scientific dependencies.
fastf1 = ["fastf1>=3.3"]
dev = ["pytest>=8.0"]

[project.scripts]
scoutmini = "scoutmini.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scoutmini*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
